<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/css/bootstrap.min.css" />
    <title>Bootstrap Sandbox | Carousel</title>
  </head>
  <body>
    <div class="container">
      <h1 class="mb-5">Carousel</h1>

      <!-- Carousel -->
        <div id="slider" class="carousel slide">

            <!-- Indicators -->
            <div class="carousel-indicators">
                <button
                    type="button"
                    data-bs-target="#slider"
                    data-bs-slide-to="0"
                    class="active">
                </button>

                <button
                    type="button"
                    data-bs-target="#slider"
                    data-bs-slide-to="1">
                </button>

                <button
                    type="button"
                    data-bs-target="#slider"
                    data-bs-slide-to="2">
                </button>
            </div>

            <!-- Images -->
            <div class="carousel-inner">
                <!-- Slide 1 -->
                <div class="carousel-item active">
                    <img src="p1.jpg" class="d-block w-100"
                         alt="First image">

                    <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50">
                        <h5>First Slide</h5>
                        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Laboriosam, debitis!</p>
                    </div>
                </div>

                <!-- Slide 2 -->
                <div class="carousel-item">
                    <img src="p2.jpg" class="d-block w-100"
                         alt="Second image">

                    <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50">
                        <h5>Second Slide</h5>
                        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Aut, ad!</p>
                    </div>
                </div>

                <!-- Slide 3 -->
                <div class="carousel-item">
                    <img src="p3.jpg" class="d-block w-100"
                         alt="Third slide">

                    <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50">
                        <h5>Third Slide</h5>
                        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ab, non!</p>
                    </div>
                </div>

            </div>

            <!-- Previous Button -->
            <button
                type="button"
                class="carousel-control-prev"
                data-bs-target="#slider"
                data-bs-slide="prev">

                <span class="carousel-control-prev-icon"
                      aria-hidden="true"></span>

                <span class="visually-hidden">Previous</span>
            </button>

            <!-- Next Button -->
            <button
                type="button"
                class="carousel-control-next"
                data-bs-target="#slider"
                data-bs-slide="next">

                <span class="carousel-control-next-icon"
                      aria-hidden="true"></span>

                <span class="visually-hidden">Next</span>
            </button>

        </div>
      <!-- Don't go past here -->
    </div>
    <div style="margin-top: 350px"></div>

    <script src="./assets/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
