<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple HTML practice page">
    <meta name="keywords" content="HTML, CSS, practice, Samiha">
    <title>HTML Practice-Samiha</title>
</head>
<body>
    <h1>Image Tags Practice</h1>
    

    <!--Image from local directory (Relative Path)-->
    <img src="images/cats.jpg" alt="Cat Selfie" width="300"><br>
    <!--Image from external source (Absolute Path)-->
    <img src="https://ichef.bbci.co.uk/ace/standard/976/cpsprodpb/1475B/production/_91930838_h_02605528.jpg" alt="Rabbit" width="300"><br>  
    <!--Image with title attribute-->
    <img src="images/cats.jpg" alt="Cat Selfie" width="300" title="This is a cat image"><br>
    <!--Image with link-->
    <a href="https://coolbackgrounds.io/" target="_blank">
        <img src="images/cats.jpg" alt="Cat Selfie" width="300">   
    </a><br>
    <!--Image with link and title attribute-->
    <a href="https://coolbackgrounds.io/" target="_blank" title="Visit cool background page">
        <img src="images/cats.jpg" alt="Cat Selfie" width="300">
    </a><br>


    <!--with fig & figcaption-->
    <figure>
        <img src="images/cats.jpg" alt="Cat Selfie" width="300" height="300">
        <figcaption>This is a cat image</figcaption>
    </figure>

    
</body>
</html>
