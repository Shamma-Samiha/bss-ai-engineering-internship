<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ID and Class Practice</title>

    <style>

        #special-note {
            color: red;
        }

        .student {
            background-color: lightblue;
            padding: 10px;
            margin: 10px;
        }

        .highlight {
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>


    <h1 >ID and Class Practice</h1>

    <h2>Student Information</h2>
     
    <p id="special-note">This is an important notice!</p>

    <!-- Same class used multiple times -->
    <p class="student">Student 1: Samiha</p>

    <!-- Multiple classes -->
    <p class="student highlight">
        This student is highlighted.
    </p>

</body>
</html>
