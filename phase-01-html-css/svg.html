<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Practice</title>
</head>
<body>
    <h2>SVG Practice</h2>
    <svg width="200" height="200">
        <circle cx="100" cy="100" r="80" stroke="blue" stroke-width="3" fill="red" />
        <rect x="50" y="50" width="100" height="100" stroke="black" stroke-width="3" fill="blue" />
        <line x1="0" y1="0" x2="200" y2="200" stroke="green" stroke-width="2"/>
        <text x="50" y="180" font-family="Verdana" font-size="20" fill="black">Hello SVG</text> 
    </svg>
</body>
</html>
