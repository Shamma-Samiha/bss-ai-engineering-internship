<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables & iframes</title>
</head>
<body>
    <h2>Table Example</h2>

    <table border="1">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>
        <tr>
            <td>Nafisa</td>
            <td>25</td>
            <td>Dhaka</td>
        </tr>
        <tr>
            <td>John</td>
            <td>30</td>
            <td>Chittagong</td>
        </tr>
    </table>
    <br><br>

    <!-- Table with colspan,rowspan,colgroup, thead and tbody -->

    <table border="2.8">
        <colgroup>
            <col span="2" style="background-color: lightblue;">
            <col style="background-color: lightgreen;">
        </colgroup>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>City</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Nafisa</td>
                <td>25</td>
                <td>Dhaka</td>
            </tr>
            <tr>
                <td>26</td>
                <td>Chittagong</td>
            </tr>
            <tr>
                <td colspan="2">John</td>
                <td>30</td>
            </tr>
        </tbody>
    </table>
    <br><br>


    <h2>Iframe Example</h2>

    <!--Embedding website-->
    <iframe src="https://data.mendeley.com/research-data/?search=deeplearning%20agriculture&from=2024&data_type=dataset" width="600" height="400" title="Example Iframe"></iframe>

    <!--Embedding youtube video-->
    <iframe width="560" height="315" src="https://www.youtube.com/embed/5qap5aO4i9A"></iframe>

    <!--Embedding google map-->
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3650.1234567890123!2d90.41234567890123!3d23.810123456789012!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3755c12345678901%3A0x123456789abcdef0!2sDhaka%20City%20Center!5e0!3m2!1sen!2sbd!4v1234567890123" width="600" height="450" style="border:0"> </iframe>

    <!--Embedding pdf file-->
    <iframe src="Knapsack.pdf" width="600" height="400"></iframe>

</body>
</html>
