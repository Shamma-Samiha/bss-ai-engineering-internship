<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>Audio & Video Integration Practice</title>
</head>
<body>
    <h2>Audio & Video Integration Practice</h2>

    <h3>Audio Example</h3>

    <audio src="audio.mp3" type="audio/mpeg" controls> </audio>

    <!--By using Source tag-->
    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        <!--fallback-->
        Your browser does not support the audio element.
    </audio>

    <!--auto bar bar choltei thakbe-->
    <audio src="audio.mp3" type="audio/mpeg" autoplay controls loop> </audio>

    <h3>Video Example</h3>

    <video src="video (2).mp4" type="video/mp4" controls> </video>
    <!--baki stuff o same as audio stuff-->
       
</body>
</html>
